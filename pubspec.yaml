name: clock_it
description: Clock it — cuenta tus horas de SFP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  share_plus: ^10.1.4
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  firebase_core: 4.10.0 # 4.11+ needs Xcode 16.3
  # 7.1 expects a field the 4.10 native side doesn't send: startup fails.
  firebase_core_platform_interface: '>=7.0.1 <7.1.0'
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  shaders:
    - shaders/flow.frag
  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-Regular.otf
          weight: 400
        - asset: assets/fonts/Epilogue-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Epilogue-Bold.otf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf

# `dart run flutter_launcher_icons`
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/images/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#A4D266' # green at 80% on white, like the design's icon
  adaptive_icon_foreground: assets/images/icon/adaptive_foreground.png
  min_sdk_android: 21

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: '#F3F0E6'
  image: assets/images/icon/splash_logo.png
  android_12:
    color: '#F3F0E6'
    image: assets/images/icon/adaptive_foreground.png
  fullscreen: false
